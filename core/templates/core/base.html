{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Removals Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS - helper only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <!-- Industrial Theme -->
  <link rel="stylesheet" href="{% static 'core/industrial.css' %}">
</head>

<body class="rm-body">
  <nav class="rm-navbar">
    <div class="rm-navbar-inner">
      <a class="rm-brand" href="{% url 'home' %}">REMOVAL MANAGER</a>
      <div class="rm-nav-links">
        <a href="{% url 'planning_request_create' %}">Create Planning Request</a>
        <a href="{% url 'how_to_use' %}">How To Use</a>
      </div>
    </div>
  </nav>
  <main class="rm-app-shell">
    {% block content %}{% endblock %}
  </main>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery required for Select2 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Select2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>

</html>

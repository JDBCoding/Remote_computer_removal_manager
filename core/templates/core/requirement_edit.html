{% extends "core/base.html" %}

{% block content %}
<section class="rm-requirements-page">
<header class="rm-form-header">
<div>
<div class="rm-form-kicker">Installation Requirement</div>
<h1 class="rm-form-title">Edit Requirement</h1>
<p class="rm-form-subtitle">

                Update the requirement type or note for {{ requirement.part.part_number }}.
</p>
</div>
</header>
<section class="rm-form-panel">
<div class="rm-panel-title">Requirement Details</div>
<form method="post" class="rm-requirement-form">

            {% csrf_token %}
<div class="rm-form-grid rm-form-grid-2">
<div class="rm-field">
<label for="{{ form.requirement_type.id_for_label }}">Requirement Type</label>

                    {{ form.requirement_type }}
</div>
<div class="rm-field">
<label for="{{ form.note.id_for_label }}">Notes</label>

                    {{ form.note }}
</div>
</div>
<div class="rm-form-actions">
<button type="submit" class="btn btn-primary">

                    Save Changes
</button>
<a href="{% url 'edit_requirements' requirement.part.part_number %}" class="btn btn-secondary">

                    Cancel
</a>
</div>
</form>
</section>
</section>

{% endblock %}
